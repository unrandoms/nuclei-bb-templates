id: auth-capability-link

info:
  name: Authentication Bypass via Predictable Capability Token
  author: chipo
  severity: high
  description: |
    Tests whether capability-based authentication tokens (password reset links,
    email verification tokens, one-time login links) are generated using predictable
    or insufficiently random values. Probes common patterns: MD5/SHA1 of email or
    timestamp, base64-encoded email address, UUID v1 (time-based and guessable),
    and sequential integers. Also checks whether token endpoints leak the token
    in the response body or headers after generation, allowing account takeover
    without brute-force.
  reference:
    - https://cwe.mitre.org/data/definitions/330.html
    - https://cwe.mitre.org/data/definitions/640.html
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/04-Authentication_Testing/09-Testing_for_Weak_Password_Change_or_Reset_Functionalities
  metadata:
    false-positive: |
      Applications that return success messages without the token itself will not
      confirm this finding. The high-confidence signal is the token appearing in
      the response body or a Location header. Predictability analysis requires
      collecting multiple tokens — this template detects structural weakness only.
    max-request: 3
  tags: auth,capability-link,password-reset,token-predictability,owasp-a07

http:
  - raw:
      - |
        POST /api/v1/auth/reset-password HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json
        Connection: close

        {"email": "test@{{Hostname}}"}

      - |
        POST /api/v1/auth/forgot-password HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json
        Connection: close

        {"email": "test@{{Hostname}}"}

      - |
        POST /api/auth/request-magic-link HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json
        Connection: close

        {"email": "test@{{Hostname}}"}

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        name: token-in-response
        regex:
          - '"token"\s*:\s*"([A-Za-z0-9+/=_-]{16,})"'
          - '"reset_token"\s*:\s*"([A-Za-z0-9+/=_-]{16,})"'
          - '"magic_link"\s*:\s*"(https?://[^"]+token=[^"]+)"'
          - '"link"\s*:\s*"(https?://[^"]+[?&]token=[^"&]+)"'

      - type: regex
        part: header
        name: token-in-header
        regex:
          - "Location:.*[?&]token=[A-Za-z0-9+/=_-]{8,}"
          - "Location:.*[?&]reset=[A-Za-z0-9+/=_-]{8,}"

      - type: dsl
        name: weak-uuid-v1
        dsl:
          - "regex(\"[0-9a-f]{8}-[0-9a-f]{4}-1[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}\", body)"
