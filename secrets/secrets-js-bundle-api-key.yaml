id: secrets-js-bundle-api-key

info:
  name: API Keys and Secrets in JavaScript Bundles
  author: chipo
  severity: medium
  description: |
    Scans JavaScript bundle files for hardcoded API keys, private tokens, and cloud
    provider credentials. Checks for common secret patterns including AWS access key
    IDs and secret access keys, Google API keys, Stripe publishable and secret keys,
    Slack bot tokens, GitHub personal access tokens, Twilio auth tokens, SendGrid
    API keys, and generic high-entropy strings assigned to variables named apiKey,
    secret, token, or password.
  reference:
    - https://cwe.mitre.org/data/definitions/312.html
    - https://cwe.mitre.org/data/definitions/798.html
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
  metadata:
    false-positive: |
      Publishable Stripe keys (pk_live_, pk_test_) are intentionally client-side and
      are not a secret exposure. AWS_ACCESS_KEY_ID starting with AKIA is a hard IAM
      credential — always a finding. Validate high-entropy regex matches against
      entropy calculators before reporting.
    max-request: 5
  tags: secrets,api-key,hardcoded,javascript,exposure,owasp-a02

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/js/main.js"
      - "{{BaseURL}}/static/js/app.js"
      - "{{BaseURL}}/js/bundle.js"
      - "{{BaseURL}}/assets/app.js"
      - "{{BaseURL}}/dist/bundle.js"

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"
          - "AIza[0-9A-Za-z\\-_]{35}"
          - "(sk_live_|sk_test_)[0-9a-zA-Z]{24,}"
          - "xox[baprs]-([0-9a-zA-Z]{10,48})"
          - "ghp_[A-Za-z0-9]{36}"
          - "github_pat_[A-Za-z0-9_]{82}"
          - "SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"
          - "SK[0-9a-fA-F]{32}"
        condition: or

      - type: regex
        part: body
        regex:
          - "(?i)(api_?key|apikey|api_?secret|secret_?key|auth_?token|access_?token)\\s*[=:]\\s*['\"]([A-Za-z0-9+/=_-]{20,})['\"]"
        condition: or

    extractors:
      - type: regex
        part: body
        name: found_secret_pattern
        regex:
          - "AKIA[0-9A-Z]{16}"
          - "AIza[0-9A-Za-z\\-_]{35}"
          - "(sk_live_|sk_test_)[0-9a-zA-Z]{24,}"
          - "xox[baprs]-([0-9a-zA-Z]{10,48})"
