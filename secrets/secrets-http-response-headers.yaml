id: secrets-http-response-headers

info:
  name: Sensitive Secrets in HTTP Response Headers
  author: chipo
  severity: medium
  description: |
    Scans HTTP response headers for accidental exposure of secrets, tokens, and
    credentials. Checks for Authorization headers returned in responses (token
    reflection), API keys in X-Api-Key or similar custom headers, internal session
    tokens, and debug headers that expose environment variables or stack traces.
    Also checks for CORS misconfigurations that pair with any of the above.
  reference:
    - https://cwe.mitre.org/data/definitions/200.html
    - https://cwe.mitre.org/data/definitions/312.html
    - https://owasp.org/www-project-top-ten/2021/A02_2021-Cryptographic_Failures
  metadata:
    false-positive: |
      Medium-high. Custom X- headers vary widely across applications. Manually verify
      that matched header values are actual secrets rather than placeholder strings
      or documentation artifacts.
    max-request: 1
  tags: secrets,exposure,headers,information-disclosure,owasp-a02

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/api/v1/"
      - "{{BaseURL}}/health"

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)X-Api-Key: [A-Za-z0-9+/]{20,}"
          - "(?i)Authorization: Bearer [A-Za-z0-9._-]{20,}"
          - "(?i)X-Auth-Token: [A-Za-z0-9+/]{16,}"
          - "(?i)X-Secret: .{8,}"
          - "(?i)X-Internal-Token: .{8,}"
          - "(?i)X-Debug-Token: .{8,}"
        condition: or

      - type: word
        part: header
        words:
          - "X-Powered-By: PHP"
          - "Server: Apache/2.2"
          - "X-AspNet-Version:"
        condition: or
        negative: false

      - type: dsl
        dsl:
          - "regex(\"(?i)x-api-key|x-auth-token|x-secret|x-internal\", header)"

    extractors:
      - type: regex
        part: header
        name: exposed_header_value
        regex:
          - "(?i)(X-Api-Key|X-Auth-Token|X-Secret|X-Internal-Token):\s*([^\r\n]+)"
