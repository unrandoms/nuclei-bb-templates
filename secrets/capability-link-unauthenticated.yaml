id: capability-link-unauthenticated

info:
  name: Unauthenticated Access via Capability Link
  author: chipo
  severity: high
  description: |
    Detects endpoints that implement capability-based access control through URL tokens
    (magic links, share links, download tokens) without requiring session authentication.
    Probes common capability link patterns and checks whether the response returns
    sensitive content with HTTP 200 and no redirect to a login page. These patterns
    are often found in file sharing, report export, and email verification flows.
  reference:
    - https://cwe.mitre.org/data/definitions/284.html
    - https://cwe.mitre.org/data/definitions/306.html
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/05-Authorization_Testing/02-Testing_for_Bypassing_Authorization_Schema
  metadata:
    false-positive: |
      High for publicly intended sharing links. Validate that the accessed content
      belongs to a user-specific resource (contains PII, account data, internal
      documents) rather than a generic shared asset. The severity applies only when
      sensitive data is returned.
    max-request: 6
  tags: capability-link,auth,broken-access-control,owasp-a01,share-link

http:
  - method: GET
    path:
      - "{{BaseURL}}/download?token={{randstr}}"
      - "{{BaseURL}}/share/{{randstr}}"
      - "{{BaseURL}}/report/export?key={{randstr}}"
      - "{{BaseURL}}/api/v1/export?access_token={{randstr}}"
      - "{{BaseURL}}/file/{{randstr}}/download"
      - "{{BaseURL}}/magic-link?token={{randstr}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "len(body) > 100"
          - "!contains(body, \"login\")"
          - "!contains(body, \"sign in\")"
          - "!contains(body, \"authenticate\")"
          - "!contains(body, \"unauthorized\")"
          - "!contains(body, \"invalid token\")"
          - "!contains(body, \"expired\")"
        condition: and

      - type: word
        part: body
        words:
          - "email"
          - "password"
          - "name"
          - "address"
          - "phone"
          - "ssn"
          - "credit"
          - "account"
        condition: or
